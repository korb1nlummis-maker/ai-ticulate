<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Claude</title>
  </head>
  <body>
    <div id="root">
      <main>
        <div class="conversation">
          <div data-testid="user-message">
            <p class="break-words">first user message</p>
          </div>
          <div class="font-claude-message">
            <div class="message-content">
              <p class="font-claude-response-body break-words">first assistant message</p>
            </div>
          </div>
          <div data-testid="user-message">
            <p class="break-words">second user message</p>
          </div>
          <div class="font-claude-message">
            <div class="message-content">
              <p class="font-claude-response-body break-words">second assistant message</p>
            </div>
          </div>
        </div>
        <fieldset class="composer">
          <div data-testid="chat-input">
            <div
              contenteditable="true"
              aria-label="Write your prompt to Claude"
              class="ProseMirror"
              role="textbox"
            ></div>
          </div>
          <button aria-label="Send message" type="button">Send</button>
        </fieldset>
      </main>
    </div>
  </body>
</html>
